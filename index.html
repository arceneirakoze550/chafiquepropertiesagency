<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chafique Property Agency | Houses & Properties in Kigali, Rwanda</title>
    <meta name="description" content="Explore verified houses for sale and rent, luxury villas, modern apartments, and prime plots across Kigali, Rwanda with Chafique Property Agency." />
    <link rel="canonical" href="https://chafiquepropertiesagency.vercel.app/" />

    <!-- Favicons and App Icons for Google Search and Browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chafiquepropertiesagency.vercel.app/" />
    <meta property="og:title" content="Chafique Property Agency | Houses & Properties in Kigali, Rwanda" />
    <meta property="og:description" content="Explore verified houses for sale and rent, luxury villas, modern apartments, and prime plots across Kigali, Rwanda with Chafique Property Agency." />
    <meta property="og:image" content="https://chafiquepropertiesagency.vercel.app/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Chafique Property Agency Kigali Logo" />
    <meta property="og:site_name" content="Chafique Property Agency" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chafique Property Agency | Houses & Properties in Kigali, Rwanda" />
    <meta name="twitter:description" content="Explore verified houses for sale and rent, luxury villas, modern apartments, and prime plots across Kigali, Rwanda with Chafique Property Agency." />
    <meta name="twitter:image" content="https://chafiquepropertiesagency.vercel.app/logo.png" />
    <meta name="twitter:image:alt" content="Chafique Property Agency Kigali Logo" />

    <!-- Geo Directives (Kigali, Rwanda) -->
    <meta name="geo.region" content="RW" />
    <meta name="geo.placename" content="Kigali" />
    <meta name="geo.position" content="-1.9441;30.1035" />
    <meta name="ICBM" content="-1.9441, 30.1035" />

    <!-- DNS Preconnect for Performance -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <!-- Immediate Brand Preloader (before JS bundle loads) -->
      <div id="static-preloader" style="position:fixed;inset:0;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#ffffff;text-align:center;padding:20px;">
        <div style="background:#ffffff;padding:12px;border-radius:20px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);margin-bottom:20px;display:flex;align-items:center;justify-content:center;width:80px;height:80px;">
          <img src="/logo.png" alt="Chafique Property Agency Logo" style="width:100%;height:100%;object-fit:contain;" />
        </div>
        <h1 style="font-size:22px;font-weight:900;letter-spacing:-0.5px;margin:0 0 6px 0;text-transform:uppercase;color:#ffffff;">
          Chafique <span style="color:#10b981;">Property Agency</span>
        </h1>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 20px 0;letter-spacing:0.5px;">
          Premier Real Estate in Kigali, Rwanda
        </p>
        <div style="width:140px;height:4px;background:#1e293b;border-radius:9999px;overflow:hidden;">
          <div style="width:40%;height:100%;background:#10b981;border-radius:9999px;animation:initialPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes initialPulse {
            0% { transform: translateX(-100%); width: 30%; }
            50% { width: 60%; }
            100% { transform: translateX(300%); width: 30%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
